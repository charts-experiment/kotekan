---
# ==============================================================================
# CHARTS 64-Antenna Tri-Engine Real-Time GPU Pipeline with Raw File Writes
# ==============================================================================
# Engines:
#   1. Direct Multi-Beam Tracker (cudaDirectBeamTrackerCommand, 4 tracked beams)
#   2. FRB Beamformer (cudaUpchannelizer_charts_U32_K4 + cudaFRBBeamformer_charts_U32)
#   3. Astron WMMA Correlator (cudaShuffleAstron + cudaCorrelatorAstron, 2080 baselines)
# Data: 51.2 ms window (15,360 samples, 336 coarse freqs, 64 dishes x 2 pol = 128 inputs)
# Ingestion: chartsFEngineSim with astrophysical FRB model
# ==============================================================================

type: config
log_level: info
cpu_affinity: [0, 1, 2, 3]

upchan_factors: [32]
upchan_channel_ranges:
    32: [0, 336]

telescope:
    name: CHORDTelescope
    require_gps: false
    require_eop: false
    origin_itrs_lat_deg: -33.4211146
    origin_itrs_lon_deg: -70.8634710
    dish_grid_size_x: 8
    dish_grid_size_y: 8
    dish_separation_x_m: 0.6
    dish_separation_y_m: 0.6
    num_dishes: 64
    num_polarizations: 2
    bf_mask_lifetime_in_samples: 15360
    dish_inputs:
      - {dish_idx: 0, grid_x_idx: 0, grid_y_idx: 0, feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: D00}
