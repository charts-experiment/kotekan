    bf_mask: host_bf_mask_buffer
    num_dishes: 64
    num_polarizations: 2
    bf_mask_lifetime_in_samples: 15360
    metadata_source: host_voltage_buffer

# ------------------------------------------------------------------------------
# GPU Stage: Engine 1 (Direct Tracker) & Engine 3 (Astron Correlator)
# ------------------------------------------------------------------------------
gpu_main:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        buffer_depth: 1
        frame_arrival_period: 0.0512
        in_buffers:
            host_voltage_buffer: host_voltage_buffer
        out_buffers:
            host_direct_beams_buffer: host_direct_beams_buffer
            host_correlation_buffer: host_correlation_buffer
        commands:
        - name: cudaInputData
          in_buf: host_voltage_buffer
          gpu_mem: voltage_main
        - name: cudaSyncInput

        # Engine 1: Direct Astrometric Multi-Beam Tracker (Target: FRB at RA=150.0, Dec=-35.0)
        - name: cudaDirectBeamTrackerCommand
          gpu_mem_voltage: voltage_main
          gpu_mem_formed_beams: direct_beams
          num_elements: 128
          num_local_freq: 336
          samples_per_data_set: 15360
          spacing_m: 0.6
          max_beams: 4
          initial_active_beams: 1
          buffer_depth: 1
          time_chunk_size: 256
          time_unroll: 4
          beam_tile_size: 4
          enable_cuda_graph: false
          enable_grid_mode: false
          site_lat_deg: -33.4211146
          site_lon_deg: -70.8634710
          site_alt_m: 458.0
          freq_start_hz: 300000000.0
          freq_step_hz: 300000.0
          source_ra_deg: 150.00
          source_dec_deg: -35.00

        # Engine 3: Astron WMMA Tensor Core Correlator (All 2,080 Baselines)
        - name: cudaShuffleAstron
          gpu_mem_voltage: voltage_main
          gpu_mem_ordered_voltage: ordered_voltage
          num_elements: 128
          num_local_freq: 336
          samples_per_data_set: 15360
          num_data_sets: 1
          block_size: 2
          num_blocks: 528
          buffer_depth: 1

        - name: cudaCorrelatorAstron
          kernel_path: ./lib/cuda/kernels
          gpu_mem_voltage: ordered_voltage
          gpu_mem_correlation_matrix: correlation_matrix
          num_elements: 128
          num_local_freq: 336
          samples_per_data_set: 15360
          num_data_sets: 1
          block_size: 2
          num_blocks: 528
          elements_per_thread_block: 32
          buffer_depth: 1

        - name: cudaSyncOutput
        - name: cudaOutputData
          gpu_mem: direct_beams
          out_buf: host_direct_beams_buffer
        - name: cudaOutputData
