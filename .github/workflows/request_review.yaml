name: Auto Request Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-review:
    name: "Request review from fmpalmab"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'fmpalmab'
    steps:
      - name: Request review from fmpalmab
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: ['fmpalmab']
              });
              console.log(`Successfully requested review from @fmpalmab on PR #${context.payload.pull_request.number}`);
            } catch (error) {
              console.warn(`Could not request review from @fmpalmab: ${error.message}`);
            }
