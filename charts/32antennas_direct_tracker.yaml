---
# ==============================================================================
# CHARTS 32-Antenna Live DPDK Ingest & Real-Time GPU DIRECT Beam Tracker Pipeline
# ==============================================================================
# Uses the zero-window, direct-weight CUDA beamformer (cudaDirectBeamTrackerCommand).
# Eliminates intra-frame integration windows and applies precalculated complex weights
# directly across 153,600 samples per frame.

type: config
log_level: INFO

# Memory & Buffer Management
buffer_depth: 30                  # Host RAM frame queue depth
gpu_buffer_depth: 2              # GPU VRAM frame queue depth (fits comfortably in 24GB RTX 4090)

# Data Dimensions & Sampling
samples_per_data_set: 153600     # Samples per frame (0.512 seconds at 3.33 us/sample)
capture_n_frames: 45000          # Total capture run frames
cpu_affinity: [0, 1]

# Timing & Frame Arrival (RFSoC 300 MSPS PFB -> 10/3 us per time sample)
sample_period_s: 3.333333333333e-6
frame_arrival_period: samples_per_data_set * sample_period_s

# Array & Frequency Sharding (32 antennas x 672 local channels)
num_elements: 32                 # 32 Antennas (polarization / element lines)
num_local_freq: 672              # Number of frequencies per stream sent to this node
n_channels_per_packet: 168       # RFSoC packet channel packing
packets_per_spectrum: 4          # Packets needed to assemble 1 spectrum (168 * 4 = 672)
bytes_per_dataset: n_channels_per_packet * packets_per_spectrum * samples_per_data_set

# Array Geometry & Multi-Beam Setup
spacing_m: 0.6                   # Physical antenna spacing (meters)
max_beams: 4                     # Allocated concurrent beam slots (0..3)
initial_active_beams: 2          # Beams active at startup (1..4)
sizeof_complex_float: 8          # float2 (4-byte real + 4-byte imag) per formed beam sample

# ------------------------------------------------------------------------------
# Metadata & Memory Pool
# ------------------------------------------------------------------------------
main_pool:
    kotekan_metadata_pool: chartsMetadata
    num_metadata_objects: buffer_depth * 15

# ------------------------------------------------------------------------------
# Buffer Definitions
# ------------------------------------------------------------------------------
# Captured raw network voltages from DPDK (4-bit complex samples packed as int4x2_t)
network_capture_buf:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: bytes_per_dataset * num_elements
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

# Lost packets / dropped sample mask from DPDK
mask_buffer_zeros:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set
    numa_node: 0
    metadata_pool: main_pool

# Output formed beam complex voltages [time][freq][max_beams] of float2
host_formed_beams_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set * num_local_freq * max_beams * sizeof_complex_float
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

# ------------------------------------------------------------------------------
# Network Ingest Stage: DPDK Core
# ------------------------------------------------------------------------------
dpdk:
    kotekan_stage: dpdkCore
    lcore_cpu_map: [3]
    main_lcore_cpu: 4
    lcore_port_map:
        - [0]
    max_rx_pkt_len: 9000
    num_mbufs: 9600
    handlers:
        - dpdk_handler: rfsocHandlerNoClk
          out_buffer: network_capture_buf
          alignment: 4000
          mask_buf: mask_buffer_zeros
        - dpdk_handler: none

# ------------------------------------------------------------------------------
# Lost Packet Zeroing Stage
# ------------------------------------------------------------------------------
zero_samples:
    kotekan_stage: zeroSamples
    out_buf: network_capture_buf
    lost_samples_buf: mask_buffer_zeros
    zero_value: 0
    sample_size: 21504  # num_elements (32) * num_local_freq (672)

# ------------------------------------------------------------------------------
# GPU Direct Multi-Beam Tracker Stage (Zero Integration Window)
# ------------------------------------------------------------------------------
gpu:
    profiling: false
    commands: &command_list
        - name: cudaInputData
          in_buf: host_voltage
          gpu_mem: voltage
        - name: cudaSyncInput
        - name: cudaAntennaMaskCommand
          gpu_mem_voltage: voltage
          num_elements: 32
          num_local_freq: 672
          samples_per_data_set: 153600
          buffer_depth: 2
          auto_detect_enabled: true
          blank_voltages_enabled: true
          dead_power_threshold: 0.05
          sat_power_threshold: 80.0
          clip_fraction_threshold: 0.02
          revival_frames: 5
          active_raw_elements: [24, 25, 26, 27, 28, 29, 30, 31]
        - name: cudaDirectBeamTrackerCommand
          gpu_mem_voltage: voltage
          gpu_mem_formed_beams: formed_beams
          num_elements: 32
          num_local_freq: 672
          samples_per_data_set: 153600
          spacing_m: 0.6
          max_beams: 4
          initial_active_beams: 2
          buffer_depth: 2
          time_chunk_size: 256
          time_unroll: 4
          beam_tile_size: 4         # Fuses up to 4 beams into 1 warp, cutting DRAM bandwidth by 4x
          enable_cuda_graph: true   # Zero CPU dispatch latency via CUDA Graph execution
          enable_grid_mode: false   # Set true to use precomputed sky grid codebook
          grid_step: 0.02          # ~1.15 deg grid resolution when in grid mode
      # Carén Observatory Site Coordinates
          site_lat_deg: -33.4211146
          site_lon_deg: -70.8634710
          site_alt_m: 458.0
          freq_start_hz: 300000000.0
          freq_step_hz: 300000.0
      # Antenna mapping convention: descending (raw 31 -> physical 0)
          antenna_order: "descending"
      # Active working antennas: raw elements 31 down to 24 (physical 0 to 7)
          active_raw_elements: [24, 25, 26, 27, 28, 29, 30, 31]
      # Initial pointing: Zenith
          source_l0: 0.0
          source_m0: 0.0
        - name: cudaSyncOutput
        - name: cudaOutputData
          in_buf: host_voltage
          gpu_mem: formed_beams
          out_buf: host_formed_beams
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        buffer_depth: 2
        commands: *command_list
        in_buffers:
            host_voltage: network_capture_buf
        out_buffers:
            host_formed_beams: host_formed_beams_buffer

# ------------------------------------------------------------------------------
# Monitoring & Output
# ------------------------------------------------------------------------------
inspect_beams:
    kotekan_stage: restInspectFrame
    in_buf: host_formed_beams_buffer
    len: 4194304  # 4 MB snapshot for web dashboard / REST telemetry
