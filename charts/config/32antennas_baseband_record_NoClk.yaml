---

# This Config File is used to test the pipeline with the old 32 antenna model without the clock singal.
# Its a simple test that captures N frames of data and saves them to disk. The data is not processed in any way.

########################
#### Global options ####
########################
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: info
cpu_affinity: [0,1]

num_elements: 32
n_channels_per_packet: 168
packets_per_spectrum: 4

buffer_depth: 60
baseband_buffer_depth: buffer_depth - 10

spectra_per_dataset: 15360 # 50 ms of data (one frame)
bytes_per_dataset: n_channels_per_packet * packets_per_spectrum * spectra_per_dataset # 50 ms of data

# For basebandReadout
samples_per_data_set: 15360 
capture_n_frames: 40 

###########################
##### Pipeline buffers ####
###########################

# Main CHIME Metadata Pool
main_pool:
  kotekan_metadata_pool: chartsMetadata
  num_metadata_objects: buffer_depth * 10

# Baseband metadata pool
baseband_pool:
  kotekan_metadata_pool: BasebandMetadata
  num_metadata_objects: buffer_depth * 10

# Input data buffers from the DPDK stage
# Buffer to hold captured network packets
network_capture_buf:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: bytes_per_dataset * num_elements # 322.560.000 
  numa_node: 0
  metadata_pool: main_pool
  zero_new_frames: true

mask_buffer_zeros:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: spectra_per_dataset
  numa_node: 0
  metadata_pool: main_pool


baseband_output_buffer_0:
  kotekan_buffer: standard
  num_frames: baseband_buffer_depth
  frame_size: bytes_per_dataset * num_elements
  metadata_pool: baseband_pool

##########################
#### Pipeline Stages #####
##########################

# DPDK Stage to capture network packets
dpdk:
  kotekan_stage: dpdkCore
  lcore_cpu_map: [3]
  main_lcore_cpu: 4
  lcore_port_map:
    - [0]
  max_rx_pkt_len: 9000
  num_mbufs: 9600
  mbuf_data_size: 9000
  handlers:
    - dpdk_handler: rfsocHandlerNoClk
      out_buffer: network_capture_buf
      alignment: 4000
      mask_buf: mask_buffer_zeros
    - dpdk_handler: none

zero_samples:
 kotekan_stage: zeroSamples
 out_buf: network_capture_buf
 lost_samples_buf: mask_buffer_zeros
 zero_value: 0
 sample_size: 21504 

baseband_readout:
  kotekan_stage: chartsBasebandReadout
  in_buf: network_capture_buf
  out_buf: baseband_output_buffer_0
  freq_id: 0
  mask_buf: mask_buffer_zeros
  num_frames_buffer: buffer_depth - 10
  max_dump_samples: samples_per_data_set * capture_n_frames

# Save baseband data
baseband_save:
  kotekan_stage: BasebandWriter
  samples_per_data_set: 10321920 # bytes_per_dataset 
  num_elements: 32 
  in_buf: baseband_output_buffer_0
  root_path: /data/32_test # Config (flag)
  dump_timeout: 5
# Monitoring and debug stages ####

inspect_frame:
  kotekan_stage: restInspectFrame
  in_buf: network_capture_buf