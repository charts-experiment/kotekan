---
# ==============================================================================
# Simple CHARTS 64-Antenna GPU Direct Multi-Beam Tracker Pipeline (1-Hour Run)
# ==============================================================================
# Pipeline specification:
# - Input: Continuous baseband data generator (testDataGen)
# - Metadata: chartsMetadata (CHARTS instrument layout)
# - CUDA In-Place Antenna Health Blanking & Masking (cudaAntennaMaskCommand)
# - CHARTS Direct Astrometric Multi-Beam Tracker (cudaDirectBeamTrackerCommand, 4 beams)
# - Excludes: BiSLC (cudaBiSLCCommand) and MVSC/MVDR (chartsMvdr)
# - Output:
#     * Live REST inspection endpoint (restInspectFrame)
#     * Formed complex voltage frame streaming to disk (rawFileWrite)
# ==============================================================================

type: config
log_level: info

cpu_affinity: [0, 1, 2, 3]

num_elements: 64
num_local_freq: 336
samples_per_data_set: 3840
spacing_m: 0.6
max_beams: 4
initial_active_beams: 2
buffer_depth: 4
sizeof_complex_float: 8

main_pool:
    kotekan_metadata_pool: chartsMetadata
    num_metadata_objects: 50

# Input buffer ([time][freq][antenna] of int4x2_t)
network_capture_buf:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set * num_local_freq * num_elements
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

# Output complex voltages buffer ([time][freq][max_beams] of float2)
host_formed_beams_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set * num_local_freq * max_beams * sizeof_complex_float
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

# Data Generator simulating continuous RFSoC stream
gen_data:
    kotekan_stage: testDataGen
    type: random_signed
    seed: 42
    reuse_random: true
    wait: true
    num_frames: -1
    end_interrupt: false
    out_buf: network_capture_buf

# GPU Execution Stage
gpu:
    profiling: false
    commands: &command_list
        - name: cudaInputData
          in_buf: host_voltage
          gpu_mem: voltage
        - name: cudaSyncInput
        - name: cudaAntennaMaskCommand
          gpu_mem_voltage: voltage
          num_elements: 64
          num_local_freq: 336
          samples_per_data_set: 3840
          buffer_depth: 4
          auto_detect_enabled: true
          blank_voltages_enabled: false
          dead_power_threshold: 0.50
          sat_power_threshold: 80.0
          clip_fraction_threshold: 0.15
          revival_frames: 5
        - name: cudaDirectBeamTrackerCommand
          gpu_mem_voltage: voltage
          gpu_mem_formed_beams: formed_beams
          num_elements: 64
          num_local_freq: 336
          samples_per_data_set: 3840
          spacing_m: 0.6
          max_beams: 4
          initial_active_beams: 2
          buffer_depth: 4
          time_chunk_size: 256
          time_unroll: 4
          beam_tile_size: 4
          enable_cuda_graph: false
          enable_grid_mode: false
          site_lat_deg: -33.4211146
          site_lon_deg: -70.8634710
          site_alt_m: 458.0
          freq_start_hz: 300000000.0
          freq_step_hz: 300000.0
          source_ra_deg: 266.4168
          source_dec_deg: -29.0078
          source_ra_deg_1: 128.8361
          source_dec_deg_1: -45.1764
        - name: cudaSyncOutput
        - name: cudaOutputData
          in_buf: host_voltage
          gpu_mem: formed_beams
          out_buf: host_formed_beams
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        commands: *command_list
        in_buffers:
            host_voltage: network_capture_buf
        out_buffers:
            host_formed_beams: host_formed_beams_buffer

# Live REST frame inspection
inspect_beams:
    kotekan_stage: restInspectFrame
    in_buf: host_formed_beams_buffer
    len: 4194304

# Stream output complex voltages to disk
write_voltages_output:
    kotekan_stage: rawFileWrite
    in_buf: host_formed_beams_buffer
    base_dir: /tmp/charts_pipeline_frames
    file_name: formed_beams
    file_ext: bin
    num_frames_per_file: 1
    prefix_hostname: false
    skip_zero_frames: false
    exit_after_n_files: -1
    write_every_n_frames: 40
