---
# ==============================================================================
# CHARTS 64-Antenna DPDK -> 4-Beam Direct Tracker: Full-Day Solar Transit (Nov 3)
# Window: 06:00 AM to 21:00 PM CLT (15 Hours)
# ==============================================================================
# - Observation Objective: Full diurnal solar drift-scan measuring cold-sky baseline,
#   morning ingress, high-elevation transits, afternoon egress, and sunset baseline.
# - Non-Overlapping Stationary Beams (EW FWHM ~12.0°, Null-to-Null ~24.0°):
#   Adjacent beams spaced by 3.0 hours (~43.3° angular separation), providing
#   ~20° (>80 min) pure cold-sky gaps between beam first-nulls (ZERO OVERLAP):
#     * Beam 0 (09:00 CLT Transit): l0 = +0.8869, m0 = -0.0083, n0 = +0.4619 (Alt 27.5°, Az  90.5°)
#     * Beam 1 (12:00 CLT Transit): l0 = +0.3577, m0 = +0.2750, n0 = +0.8924 (Alt 63.2°, Az  52.4°)
#     * Beam 2 (15:00 CLT Transit): l0 = -0.3809, m0 = +0.2691, n0 = +0.8846 (Alt 62.2°, Az 305.2°)
#     * Beam 3 (18:00 CLT Transit): l0 = -0.8960, m0 = -0.0229, n0 = +0.4434 (Alt 26.3°, Az 268.5°)
# - Active Antennas: [0, 4, 5, 6, 32] (raw elements [63, 59, 58, 57, 31])
# - Gains: /home/fpalma/kotekan/charts/config/gains/gains_sun_transit_1027_interp.npy
# - Storage Budget Plan (Total Planned: ~7.2 GB / 10.0 GB Budget):
#     * Continuous Beam Power: write_every_n_frames: 20 (~1.024s cadence) -> ~580 MB total (15h)
#     * Periodic Complex Voltages (float2): write_every_n_frames: 52734 (~45 min) -> 20 files -> ~6.6 GB
# ==============================================================================

type: config
log_level: info

cpu_affinity: [6, 7, 8, 9]

# ------------------------------------------------------------------------------
# Array Dimensions & Sampling Parameters
# ------------------------------------------------------------------------------
num_elements: 64
n_channels_per_packet: 168
local_subbands_per_packet: 2
num_local_freq: 336

sample_period_s: 3.333333333333e-6
samples_per_data_set: 15360
frame_arrival_period: samples_per_data_set * sample_period_s
bytes_per_dataset: n_channels_per_packet * local_subbands_per_packet * samples_per_data_set
capture_n_frames: 1060000         # ~15.07 hours of continuous streaming

buffer_depth: 20
gpu_buffer_depth: 3

spacing_m: 0.6
max_beams: 4
initial_active_beams: 4
sizeof_complex_float: 8
sizeof_float: 4

custom_antenna_positions: &charts_custom_antenna_positions
  - [0.0, 0.0, 0.0]  # Ant 0 (x=0.0m)
  - [0.0, 0.0, 0.0]  # Ant 1
  - [0.0, 0.0, 0.0]  # Ant 2
  - [0.0, 0.0, 0.0]  # Ant 3
  - [0.0, 0.0, 0.0]  # Ant 4
  - [0.6, 0.0, 0.0]  # Ant 5 (slot 1, x=0.6m)
  - [0.0, 0.0, 0.0]  # Ant 6
  - [0.0, 0.0, 0.0]  # Ant 7
  - [0.0, 0.0, 0.0]  # Ant 8
  - [0.0, 0.0, 0.0]  # Ant 9
  - [0.0, 0.0, 0.0]  # Ant 10
  - [0.0, 0.0, 0.0]  # Ant 11
  - [0.0, 0.0, 0.0]  # Ant 12
  - [0.0, 0.0, 0.0]  # Ant 13
  - [0.0, 0.0, 0.0]  # Ant 14
  - [0.0, 0.0, 0.0]  # Ant 15
  - [0.0, 0.0, 0.0]  # Ant 16
  - [0.0, 0.0, 0.0]  # Ant 17
  - [0.0, 0.0, 0.0]  # Ant 18
  - [0.0, 0.0, 0.0]  # Ant 19
  - [0.0, 0.0, 0.0]  # Ant 20
  - [0.0, 0.0, 0.0]  # Ant 21
  - [0.0, 0.0, 0.0]  # Ant 22
  - [0.0, 0.0, 0.0]  # Ant 23
  - [0.0, 0.0, 0.0]  # Ant 24
  - [0.0, 0.0, 0.0]  # Ant 25
  - [0.0, 0.0, 0.0]  # Ant 26
  - [0.0, 0.0, 0.0]  # Ant 27
  - [0.0, 0.0, 0.0]  # Ant 28
  - [0.0, 0.0, 0.0]  # Ant 29
  - [0.0, 0.0, 0.0]  # Ant 30
  - [0.0, 0.0, 0.0]  # Ant 31
  - [3.6, 0.0, 0.0]  # Ant 32 (slot 6, x=3.6m)
  - [0.0, 0.0, 0.0]  # Ant 33
  - [0.0, 0.0, 0.0]  # Ant 34
  - [0.0, 0.0, 0.0]  # Ant 35
  - [0.0, 0.0, 0.0]  # Ant 36
  - [4.2, 0.0, 0.0]  # Ant 37 (slot 7, x=4.2m)
  - [0.0, 0.0, 0.0]  # Ant 38
  - [0.0, 0.0, 0.0]  # Ant 39
  - [0.0, 0.0, 0.0]  # Ant 40
  - [0.0, 0.0, 0.0]  # Ant 41
  - [0.0, 0.0, 0.0]  # Ant 42
  - [0.0, 0.0, 0.0]  # Ant 43
  - [0.0, 0.0, 0.0]  # Ant 44
  - [0.0, 0.0, 0.0]  # Ant 45
  - [0.0, 0.0, 0.0]  # Ant 46
  - [0.0, 0.0, 0.0]  # Ant 47
  - [0.0, 0.0, 0.0]  # Ant 48
  - [0.0, 0.0, 0.0]  # Ant 49
  - [0.0, 0.0, 0.0]  # Ant 50
  - [0.0, 0.0, 0.0]  # Ant 51
  - [0.0, 0.0, 0.0]  # Ant 52
  - [0.0, 0.0, 0.0]  # Ant 53
  - [0.0, 0.0, 0.0]  # Ant 54
  - [0.0, 0.0, 0.0]  # Ant 55
  - [0.0, 0.0, 0.0]  # Ant 56
  - [0.0, 0.0, 0.0]  # Ant 57
  - [0.0, 0.0, 0.0]  # Ant 58
  - [0.0, 0.0, 0.0]  # Ant 59
  - [0.0, 0.0, 0.0]  # Ant 60
  - [0.0, 0.0, 0.0]  # Ant 61
  - [0.0, 0.0, 0.0]  # Ant 62
  - [0.0, 0.0, 0.0]  # Ant 63

# ------------------------------------------------------------------------------
# Metadata Pool
# ------------------------------------------------------------------------------
main_pool:
    kotekan_metadata_pool: chartsMetadata
    num_metadata_objects: buffer_depth * 15

# ------------------------------------------------------------------------------
# Host Buffers
# ------------------------------------------------------------------------------
network_capture_buf_0:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: bytes_per_dataset * num_elements # ~330.3 MB
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

mask_buffer_zeros_0:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set
    numa_node: 0
    metadata_pool: main_pool

network_capture_buf_1:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: bytes_per_dataset * num_elements # ~330.3 MB
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

mask_buffer_zeros_1:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set
    numa_node: 0
    metadata_pool: main_pool

# Output Formed Beams Buffer (Complex Voltages float2: [samples][freq][max_beams])
host_formed_beams_buffer_0:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set * num_local_freq * max_beams * sizeof_complex_float # 165,150,720 B
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

host_formed_beams_buffer_1:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set * num_local_freq * max_beams * sizeof_complex_float # 165,150,720 B
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

# Output Reduced Beam Power Buffer (float: [max_beams][num_local_freq])
host_beam_power_buffer_0:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: max_beams * num_local_freq * sizeof_float # 5,376 B
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

host_beam_power_buffer_1:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: max_beams * num_local_freq * sizeof_float # 5,376 B
    numa_node: 0
    metadata_pool: main_pool
    zero_new_frames: true
    mlock_frames: false

# ------------------------------------------------------------------------------
# Network Ingest Stage: DPDK Core (Dual Port)
# ------------------------------------------------------------------------------
dpdk:
    kotekan_stage: dpdkCore
    lcore_start_delay: 1
    lcore_cpu_map: [3, 5]
    main_lcore_cpu: 4
    lcore_port_map:
        - [0]
        - [1]
    max_rx_pkt_len: 9000
    rx_ring_size: 4096
    num_mbufs: 65536
    mbuf_data_size: 9216

    handlers:
        - dpdk_handler: rfsocHandlerShuffle
          out_buffer: network_capture_buf_0
          alignment: 15360
          mask_buf: mask_buffer_zeros_0
          first_subband: 0
          coarse_freq_start: 0
          num_local_freq: 336

        - dpdk_handler: rfsocHandlerShuffle
          out_buffer: network_capture_buf_1
          alignment: 15360
          mask_buf: mask_buffer_zeros_1
          first_subband: 2
          coarse_freq_start: 336
          num_local_freq: 336

# ------------------------------------------------------------------------------
# Dropped Packet Zeroing Stages
# ------------------------------------------------------------------------------
zero_samples_0:
    kotekan_stage: zeroSamples
    out_buf: network_capture_buf_0
    lost_samples_buf: mask_buffer_zeros_0
    zero_value: 0
    sample_size: 21504

zero_samples_1:
    kotekan_stage: zeroSamples
    out_buf: network_capture_buf_1
    lost_samples_buf: mask_buffer_zeros_1
    zero_value: 0
    sample_size: 21504

# ------------------------------------------------------------------------------
# GPU Direct 4-Beam Tracker & Antenna Health Stages
# ------------------------------------------------------------------------------
gpu:
    profiling: false

    # Command Pipeline for Stream 0 (Frequencies 0..335, 300.0 - 400.5 MHz)
    commands_0: &command_list_0
        - name: cudaInputData
          in_buf: host_voltage
          gpu_mem: voltage_0
        - name: cudaSyncInput

        - name: cudaAntennaMaskCommand
          gpu_mem_voltage: voltage_0
          num_elements: 64
          num_local_freq: 336
          samples_per_data_set: 15360
          buffer_depth: 3
          sample_stride: 4
          antenna_order: "descending"
          active_antennas: [0, 4, 5, 6, 32]
          auto_detect_enabled: true
          blank_voltages_enabled: false
          dead_power_threshold: 1.0
          sat_power_threshold: 80.0
          clip_fraction_threshold: 0.15
          revival_frames: 5

        # Direct Fused 4-Beam Tracker Kernel (4 Non-Overlapping Stationary Beams)
        - name: cudaDirectBeamTrackerCommand
          gpu_mem_voltage: voltage_0
          gpu_mem_formed_beams: formed_beams_0
          gpu_mem_beam_power: beam_power_0
          num_elements: 64
          num_local_freq: 336
          samples_per_data_set: 15360
          spacing_m: 0.6
          antenna_order: "descending"
          active_antennas: [0, 4, 5, 6, 32]
          custom_antenna_positions: *charts_custom_antenna_positions
          max_beams: 4
          initial_active_beams: 4
          buffer_depth: 3
          time_chunk_size: 256
          time_unroll: 4
          normalize_weights: true
          beam_tile_size: 4
          enable_cuda_graph: false
          gains_file: /home/fpalma/kotekan/charts/config/gains/gains_sun_transit_1027_interp.npy
          gains_antennas: [0, 5, 32, 37]
          enable_grid_mode: false
          grid_step: 0.02
          site_lat_deg: -33.4211146
          site_lon_deg: -70.8634710
          site_alt_m: 458.0
          freq_start_hz: 300000000.0
          freq_step_hz: 300000.0
          # Stationary Non-Overlapping Beams (3-Hour Spacing, ~43.3° Separation):
          # Beam 0: 09:00 CLT Transit (Alt 27.5°, Az 90.5°)
          source_l0: 0.8869
          source_m0: -0.0083
          # Beam 1: 12:00 CLT Transit (Alt 63.2°, Az 52.4°)
          source_l0_1: 0.3577
          source_m0_1: 0.2750
          # Beam 2: 15:00 CLT Transit (Alt 62.2°, Az 305.2°)
          source_l0_2: -0.3809
          source_m0_2: 0.2691
          # Beam 3: 18:00 CLT Transit (Alt 26.3°, Az 268.5°)
          source_l0_3: -0.8960
          source_m0_3: -0.0229

        - name: cudaSyncOutput
        - name: cudaOutputData
          in_buf: host_voltage
          gpu_mem: formed_beams_0
          out_buf: host_formed_beams
        - name: cudaOutputData
          in_buf: host_voltage
          gpu_mem: beam_power_0
          out_buf: host_beam_power

    # Command Pipeline for Stream 1 (Frequencies 336..671, 400.8 - 501.3 MHz)
    commands_1: &command_list_1
        - name: cudaInputData
          in_buf: host_voltage
          gpu_mem: voltage_1
        - name: cudaSyncInput

        - name: cudaAntennaMaskCommand
          gpu_mem_voltage: voltage_1
          num_elements: 64
          num_local_freq: 336
          samples_per_data_set: 15360
          buffer_depth: 3
          sample_stride: 4
          antenna_order: "descending"
          active_antennas: [0, 4, 5, 6, 32]
          auto_detect_enabled: true
          blank_voltages_enabled: false
          dead_power_threshold: 1.0
          sat_power_threshold: 80.0
          clip_fraction_threshold: 0.15
          revival_frames: 5

        # Direct Fused 4-Beam Tracker Kernel (4 Non-Overlapping Stationary Beams)
        - name: cudaDirectBeamTrackerCommand
          gpu_mem_voltage: voltage_1
          gpu_mem_formed_beams: formed_beams_1
          gpu_mem_beam_power: beam_power_1
          num_elements: 64
          num_local_freq: 336
          samples_per_data_set: 15360
          spacing_m: 0.6
          antenna_order: "descending"
          active_antennas: [0, 4, 5, 6, 32]
          custom_antenna_positions: *charts_custom_antenna_positions
          max_beams: 4
          initial_active_beams: 4
          buffer_depth: 3
          time_chunk_size: 256
          time_unroll: 4
          normalize_weights: true
          beam_tile_size: 4
          enable_cuda_graph: false
          gains_file: /home/fpalma/kotekan/charts/config/gains/gains_sun_transit_1027_interp.npy
          gains_antennas: [0, 5, 32, 37]
          enable_grid_mode: false
          grid_step: 0.02
          site_lat_deg: -33.4211146
          site_lon_deg: -70.8634710
          site_alt_m: 458.0
          freq_start_hz: 400800000.0
          freq_step_hz: 300000.0
          # Stationary Non-Overlapping Beams
          source_l0: 0.8869
          source_m0: -0.0083
          source_l0_1: 0.3577
          source_m0_1: 0.2750
          source_l0_2: -0.3809
          source_m0_2: 0.2691
          source_l0_3: -0.8960
          source_m0_3: -0.0229

        - name: cudaSyncOutput
        - name: cudaOutputData
          in_buf: host_voltage
          gpu_mem: formed_beams_1
          out_buf: host_formed_beams
        - name: cudaOutputData
          in_buf: host_voltage
          gpu_mem: beam_power_1
          out_buf: host_beam_power

stages:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        cuda_stream_base: 0
        num_cuda_streams: 6
        buffer_depth: 3
        commands: *command_list_0
        in_buffers:
            host_voltage: network_capture_buf_0
        out_buffers:
            host_formed_beams: host_formed_beams_buffer_0
            host_beam_power: host_beam_power_buffer_0

    gpu_1:
        kotekan_stage: cudaProcess
        gpu_id: 0
        cuda_stream_base: 1
        num_cuda_streams: 6
        buffer_depth: 3
        commands: *command_list_1
        in_buffers:
            host_voltage: network_capture_buf_1
        out_buffers:
            host_formed_beams: host_formed_beams_buffer_1
            host_beam_power: host_beam_power_buffer_1

# ------------------------------------------------------------------------------
# REST Telemetry Inspection Stages
# ------------------------------------------------------------------------------
inspect_beams_0:
    kotekan_stage: restInspectFrame
    in_buf: host_formed_beams_buffer_0
    len: 4194304

inspect_beams_1:
    kotekan_stage: restInspectFrame
    in_buf: host_formed_beams_buffer_1
    len: 4194304

# ------------------------------------------------------------------------------
# Continuous Integrated Beam Power Recording (~1.024s cadence -> ~580 MB total)
# ------------------------------------------------------------------------------
raw_file_write_power_0:
    kotekan_stage: rawFileWrite
    in_buf: host_beam_power_buffer_0
    base_dir: /data/tracker/solar_transit_full_day
    file_name: beam_power_freq0
    file_ext: bin
    prefix_hostname: false
    skip_frames: 20
    write_every_n_frames: 20       # ~1.024s cadence
    num_frames_per_file: 3600      # 1 hour per file (~19.3 MB)

raw_file_write_power_1:
    kotekan_stage: rawFileWrite
    in_buf: host_beam_power_buffer_1
    base_dir: /data/tracker/solar_transit_full_day
    file_name: beam_power_freq1
    file_ext: bin
    prefix_hostname: false
    skip_frames: 20
    write_every_n_frames: 20       # ~1.024s cadence
    num_frames_per_file: 3600

# ------------------------------------------------------------------------------
# Periodic Raw Complex Output Voltages float2 Snapshots (Every 45 min -> ~6.6 GB)
# ------------------------------------------------------------------------------
raw_file_write_voltages_0:
    kotekan_stage: rawFileWrite
    in_buf: host_formed_beams_buffer_0
    base_dir: /data/tracker/solar_transit_full_day
    file_name: formed_voltages_freq0
    file_ext: bin
    prefix_hostname: false
    skip_frames: 20
    write_every_n_frames: 52734    # Every 45 minutes (52734 * 0.0512s = 2700s)
    num_frames_per_file: 1
    exit_after_n_files: 20

raw_file_write_voltages_1:
    kotekan_stage: rawFileWrite
    in_buf: host_formed_beams_buffer_1
    base_dir: /data/tracker/solar_transit_full_day
    file_name: formed_voltages_freq1
    file_ext: bin
    prefix_hostname: false
    skip_frames: 20
    write_every_n_frames: 52734    # Every 45 minutes
    num_frames_per_file: 1
    exit_after_n_files: 20
