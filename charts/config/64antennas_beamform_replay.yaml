# ==============================================================================
# CHARTS 64-Antenna Unified GPU Beamformer Replay Pipeline (Dual Shard)
# ==============================================================================
type: config
log_level: info
cpu_affinity: []
num_elements: 64
num_beams: 64
samples_per_data_set: 15360
integration_spectra: 10
buffer_depth: 3
profiling: false
frame_arrival_period: samples_per_data_set / 300000.0
replay_frames: 6

main_pool:
  kotekan_metadata_pool: chartsMetadata
  num_metadata_objects: 32

voltage_0:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: samples_per_data_set * 336 * num_elements
  numa_node: 0
  mlock_frames: false
  use_hugepages: false
  metadata_pool: main_pool

intensity_0:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: ((samples_per_data_set / 32) / integration_spectra) * (336 * 32) * num_beams
  numa_node: 0
  mlock_frames: false
  use_hugepages: false
  metadata_pool: main_pool

read_voltage_0:
  kotekan_stage: rawFileRead
  buf: voltage_0
  base_dir: /tmp/charts-beamformer-replay
  file_name: voltage.shard0
  file_ext: bin
  prefix_hostname: false
  end_interrupt: false

gpu_0:
  kotekan_stage: cudaProcess
  gpu_id: 0
  buffer_depth: 3
  in_buffers:
    raw: voltage_0
  out_buffers:
    intensity: intensity_0
  commands:
    - name: cudaInputData
      in_buf: raw
      gpu_mem: charts.voltage.shard0
    - name: cudaSyncInput
    - name: cudaChartsBeamformerCommand
      input_mode: fine
      output_format: int8
      in_buf: raw
      out_buf: intensity
      shard_id: 0
      gpu_mem_voltage: charts.voltage.shard0
      gpu_mem_intensity: charts.intensity.shard0
    - name: cudaSyncOutput
    - name: cudaOutputData
      in_buf: raw
      gpu_mem: charts.intensity.shard0
      out_buf: intensity

write_0:
  kotekan_stage: rawFileWrite
  in_buf: intensity_0
  base_dir: /tmp/charts-beamformer-replay
  file_name: intensity.shard0
  file_ext: bin
  prefix_hostname: false
  num_frames_per_file: 1
  exit_after_n_files: replay_frames

voltage_1:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: samples_per_data_set * 336 * num_elements
  numa_node: 0
  mlock_frames: false
  use_hugepages: false
  metadata_pool: main_pool

intensity_1:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: ((samples_per_data_set / 32) / integration_spectra) * (336 * 32) * num_beams
  numa_node: 0
  mlock_frames: false
  use_hugepages: false
  metadata_pool: main_pool

read_voltage_1:
  kotekan_stage: rawFileRead
  buf: voltage_1
  base_dir: /tmp/charts-beamformer-replay
  file_name: voltage.shard1
  file_ext: bin
  prefix_hostname: false
  end_interrupt: false

gpu_1:
  kotekan_stage: cudaProcess
  gpu_id: 0
  buffer_depth: 3
  in_buffers:
    raw: voltage_1
  out_buffers:
    intensity: intensity_1
  commands:
    - name: cudaInputData
      in_buf: raw
      gpu_mem: charts.voltage.shard1
    - name: cudaSyncInput
    - name: cudaChartsBeamformerCommand
      input_mode: fine
      output_format: int8
      in_buf: raw
      out_buf: intensity
      shard_id: 1
      gpu_mem_voltage: charts.voltage.shard1
      gpu_mem_intensity: charts.intensity.shard1
    - name: cudaSyncOutput
    - name: cudaOutputData
      in_buf: raw
      gpu_mem: charts.intensity.shard1
      out_buf: intensity

write_1:
  kotekan_stage: rawFileWrite
  in_buf: intensity_1
  base_dir: /tmp/charts-beamformer-replay
  file_name: intensity.shard1
  file_ext: bin
  prefix_hostname: false
  num_frames_per_file: 1
  exit_after_n_files: replay_frames
