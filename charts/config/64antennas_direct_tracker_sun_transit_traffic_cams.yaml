          initial_active_beams: 4
          buffer_depth: 3
          time_chunk_size: 256
          time_unroll: 4
          beam_tile_size: 4
          enable_cuda_graph: false
          gains_file: /home/fpalma/kotekan/charts/config/gains/gains_sun_transit_1027_interp.npy
          gains_antennas: [0, 5, 32, 37]
          enable_grid_mode: false
          grid_step: 0.02
      # Carén Observatory Site Coordinates
          site_lat_deg: -33.4211146
          site_lon_deg: -70.8634710
          site_alt_m: 458.0
      # Frequency band for Stream 0 (300.0 - 400.5 MHz)
          freq_start_hz: 300000000.0
